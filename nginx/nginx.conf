user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Segurança (CLAUDE.md XV.7) ──────────────────────────────────
    # Sem isto, o nginx anuncia a própria versão no header `Server` e nas
    # páginas de erro. Saber a versão exata permite ao atacante consultar
    # os CVEs daquela build específica em vez de testar às cegas.
    server_tokens off;

    # Listagem de diretórios desligada explicitamente. O padrão do nginx já
    # é `off`, mas um `autoindex on` herdado de qualquer bloco incluído
    # exporia todos os arquivos de todos os clientes em /public e /uploads.
    autoindex off;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upload de até 200MB (mídia WhatsApp pode ser grande)
    client_max_body_size 200M;

    # WebSocket (Socket.io)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Inclui configurações de sites individuais
    include /etc/nginx/conf.d/*.conf;
}

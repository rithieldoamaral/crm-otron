# ════════════════════════════════════════════════════════════════════
# CRM Otron — Reverse proxy
# ════════════════════════════════════════════════════════════════════
# Substitua SEU_DOMINIO_FRONTEND.com.br e api.otron.tech pelos
# domínios reais antes de subir.
#
# Estrutura sugerida:
#   crm.seudominio.com.br        → frontend (interface React)
#   api.seudominio.com.br        → backend (Node + Socket.io)
# ════════════════════════════════════════════════════════════════════

# ── Redireciona HTTP → HTTPS (frontend) ─────────────────────────────
server {
    listen 80;
    server_name crm.otron.tech;

    # Permite renovação Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend (HTTPS) ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name crm.otron.tech;

    ssl_certificate     /etc/letsencrypt/live/crm.otron.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.otron.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP: 'unsafe-inline' em script/style é necessário (splash screen inline
    # no index.html + CSS-in-JS do Material-UI); ainda assim bloqueia carregar
    # scripts/objetos de origens arbitrárias, frames externos e plugins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://api.otron.tech; media-src 'self' blob: https://api.otron.tech; connect-src 'self' https://api.otron.tech wss://api.otron.tech; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    # Microfone precisa ficar liberado (gravação de áudio/mensagem de voz).
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Backend API + WebSocket (HTTPS) ─────────────────────────────────
server {
    listen 80;
    server_name api.otron.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.otron.tech;

    ssl_certificate     /etc/letsencrypt/live/api.otron.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.otron.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Upload de mídia (até 200MB)
    client_max_body_size 200M;

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts longos para uploads e long-polling
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
